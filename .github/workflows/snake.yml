
name: Generate Pastel Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate pastel snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ConstanceKwena
          outputs: |
            dist/github-snake.svg?color_snake=%23C084FC&color_dots=%23161B22,%23FCE7F3,%23F9A8D4,%23C4B5FD,%2393C5FD,%23A78BFA

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
